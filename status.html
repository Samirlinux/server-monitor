<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__STATUS_TITLE__</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --text:#1f2933; --muted:#6b7785; --border:#e3e8ee;
    --green:#16a34a; --amber:#f59e0b; --red:#dc2626; --gray:#cbd5e1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f141a; --card:#171e26; --text:#e6edf3; --muted:#8b98a5; --border:#26303b; --gray:#2c3742; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
  h1{font-size:22px;margin:0}
  .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .lang button{border:0;background:var(--card);color:var(--text);padding:6px 14px;cursor:pointer;font-size:13px}
  .lang button.on{background:var(--green);color:#fff}
  .banner{padding:16px 18px;border-radius:10px;color:#fff;font-weight:600;margin-bottom:20px}
  .banner.up{background:var(--green)} .banner.partial{background:var(--amber)} .banner.down{background:var(--red)}
  .banner small{display:block;font-weight:400;opacity:.9;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .name{font-weight:600;font-size:16px}
  .badge{font-size:13px;padding:2px 10px;border-radius:999px;color:#fff}
  .badge.UP{background:var(--green)} .badge.DOWN{background:var(--red)} .badge.UNKNOWN{background:var(--gray);color:var(--text)}
  .bars{display:flex;gap:2px;margin:12px 0 6px;direction:ltr;height:32px}
  .bar{flex:1;border-radius:2px;background:var(--gray);min-width:2px}
  .bar.g{background:var(--green)} .bar.a{background:var(--amber)} .bar.r{background:var(--red)}
  .axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);direction:ltr}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
  .stats b{color:var(--text)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>__STATUS_TITLE__</h1>
    <div class="lang">
      <button id="btn-ar" onclick="setLang('ar')">العربية</button>
      <button id="btn-en" onclick="setLang('en')">English</button>
    </div>
  </div>
  <div id="banner" class="banner up">...</div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const I18N = {
  ar: {
    up_all: 'كل السيرفرات تعمل بشكل طبيعي',
    partial: 'بعض السيرفرات بها مشكلة',
    down_all: 'كل السيرفرات متوقفة',
    counts: (u, d, t) => u + ' يعمل — ' + d + ' متوقف — من أصل ' + t,
    UP: 'يعمل', DOWN: 'متوقف', UNKNOWN: 'غير معروف',
    d90: 'قبل 90 يوم', today: 'اليوم',
    h24: '24 ساعة', d7: '7 أيام', d30: '30 يوم', d90s: '90 يوم',
    nodata: 'لا توجد بيانات',
    empty: 'لا توجد سيرفرات معروضة.',
    updated: 'آخر تحديث: ',
    err: 'تعذر تحميل البيانات، جاري إعادة المحاولة...'
  },
  en: {
    up_all: 'All systems operational',
    partial: 'Some systems are having issues',
    down_all: 'All systems are down',
    counts: (u, d, t) => u + ' up — ' + d + ' down — ' + t + ' total',
    UP: 'Operational', DOWN: 'Down', UNKNOWN: 'Unknown',
    d90: '90 days ago', today: 'Today',
    h24: '24 hours', d7: '7 days', d30: '30 days', d90s: '90 days',
    nodata: 'No data',
    empty: 'No servers to show.',
    updated: 'Last updated: ',
    err: 'Could not load data, retrying...'
  }
};

let lang = 'ar';
try {
  const q = new URLSearchParams(location.search).get('lang');
  lang = q || localStorage.getItem('status_lang') || ((navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en');
} catch (e) {}
if (!I18N[lang]) lang = 'ar';

const fmt = v => (v === null || v === undefined) ? '—' : v + '%';
const cls = p => p === null ? '' : (p >= 99.9 ? 'g' : (p >= 95 ? 'a' : 'r'));
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

let lastData = null;

function setLang(l){
  lang = l;
  try { localStorage.setItem('status_lang', l); } catch (e) {}
  applyLang();
  if (lastData) render(lastData);
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('btn-ar').className = lang === 'ar' ? 'on' : '';
  document.getElementById('btn-en').className = lang === 'en' ? 'on' : '';
}

function render(d){
  const t = I18N[lang];
  const b = document.getElementById('banner');
  b.className = 'banner ' + d.overall;
  const msg = d.overall === 'up' ? t.up_all : (d.overall === 'partial' ? t.partial : t.down_all);
  b.innerHTML = esc(msg) + '<small>' + esc(t.counts(d.up, d.down, d.total)) + '</small>';

  document.getElementById('list').innerHTML = d.servers.map(s => {
    const bars = s.bars.map(x =>
      '<div class="bar ' + cls(x.pct) + '" title="' + esc(x.day) + ' — ' + (x.pct === null ? esc(t.nodata) : x.pct + '%') + '"></div>'
    ).join('');
    return '<div class="card">' +
      '<div class="head"><span class="name">' + esc(s.name) + '</span>' +
      '<span class="badge ' + esc(s.status) + '">' + esc(t[s.status] || t.UNKNOWN) + '</span></div>' +
      '<div class="bars">' + bars + '</div>' +
      '<div class="axis"><span>' + esc(t.d90) + '</span><span>' + esc(t.today) + '</span></div>' +
      '<div class="stats">' +
        '<span>' + esc(t.h24) + ': <b>' + fmt(s.uptime_24h) + '</b></span>' +
        '<span>' + esc(t.d7) + ': <b>' + fmt(s.uptime_7d) + '</b></span>' +
        '<span>' + esc(t.d30) + ': <b>' + fmt(s.uptime_30d) + '</b></span>' +
        '<span>' + esc(t.d90s) + ': <b>' + fmt(s.uptime_90d) + '</b></span>' +
      '</div></div>';
  }).join('') || '<div class="card">' + esc(t.empty) + '</div>';

  document.getElementById('foot').textContent = t.updated + d.generated;
}

async function load(){
  try{
    const res = await fetch('/api/public-status', {cache:'no-store'});
    lastData = await res.json();
    render(lastData);
  }catch(e){
    document.getElementById('foot').textContent = I18N[lang].err;
  }
}

applyLang();
load();
setInterval(load, 30000);
</script>
</body>
</html>
